plugins {
     id 'com.android.application'
}

// def buildWithCMake = project.hasProperty('BUILD_WITH_CMAKE');
def buildWithCMake = true;

android {
    namespace = "my.id.radengan.any_conqueror"
    compileSdkVersion 36
    ndkVersion = "29.0.13846066"
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-26"
                abiFilters 'armeabi-v7a', 'arm64-v8a'//, 'x86', 'x86_64'
                // abiFilters 'arm64-v8a'
            }
            cmake {
                arguments "-DANDROID_PLATFORM=android-26", "-DANDROID_STL=c++_shared"
                abiFilters 'armeabi-v7a', 'arm64-v8a'// ,  'x86', 'x86_64'
                // abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
            assets.srcDirs = ['src/main/assets', 'jni/app/src/main/assets']

        }
        externalNativeBuild {
            if (buildWithCMake) {
                cmake {
                    version '3.31.6'
                    path 'jni/CMakeLists.txt'
                }
            } else {
                ndkBuild {
                    path 'jni/Android.mk'
                }
            }
        }

    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
